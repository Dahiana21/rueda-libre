<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Rueda Nocturna: recorridos guiados en bicicleta por Medellín de noche."
    >

    <title>Prototipo | Rueda Nocturna</title>

    <!-- TAILWIND PLAY CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#120B24] text-[#F5F3FF] antialiased">

    <main>

        <section class="mx-auto flex min-h-screen max-w-6xl items-center px-6 py-16 md:px-10">

            <div class="w-full max-w-3xl space-y-8">

                <!-- ETIQUETA DE CAMPAÑA -->
                <span class="inline-block rounded-full border border-[#8B5CF6] bg-[#2D1B4E] px-5 py-2 text-sm font-bold tracking-wider text-[#DDD6FE] uppercase">

                    Nuevo · Jueves a sábado

                </span>

                <!-- TÍTULO PRINCIPAL -->
                <h1 class="text-5xl leading-tight font-black tracking-tight text-white sm:text-7xl">

                    Rueda

                    <span class="text-[#A3E635]">
                        Nocturna
                    </span>

                </h1>

                <!-- SUBTÍTULO -->
                <p class="max-w-2xl text-xl leading-relaxed text-[#DDD6FE] md:text-2xl">

                    Descubre Medellín en bici cuando se encienden las luces.

                </p>

                <!-- DATOS DESTACADOS -->
                <div class="flex flex-wrap gap-4">

                    <div class="rounded-2xl border border-[#8B5CF6]/40 bg-[#2D1B4E] px-6 py-4 shadow-lg">

                        <p class="text-3xl font-extrabold text-[#A3E635]">
                            3 rutas
                        </p>

                        <p class="mt-1 text-sm text-[#DDD6FE]">
                            Diferentes niveles
                        </p>

                    </div>

                    <div class="rounded-2xl border border-[#8B5CF6]/40 bg-[#2D1B4E] px-6 py-4 shadow-lg">

                        <p class="text-3xl font-extrabold text-[#A3E635]">
                            Desde $55.000
                        </p>

                        <p class="mt-1 text-sm text-[#DDD6FE]">
                            Precio por persona
                        </p>

                    </div>

                </div>

                <!-- BOTÓN DE INSCRIPCIÓN -->
                <a
                    href="index.html#inscripcion"
                    class="inline-flex min-h-12 items-center justify-center rounded-xl bg-[#A3E635] px-8 py-4 text-lg font-bold text-[#120B24] shadow-lg transition-colors hover:bg-[#BEF264] focus-visible:ring-4 focus-visible:ring-[#C4B5FD] focus-visible:ring-offset-4 focus-visible:ring-offset-[#120B24] focus-visible:outline-none"
                >

                    Inscríbete

                </a>

                <!-- HORARIO -->
                <p class="text-sm font-medium text-[#DDD6FE]">

                    Jueves a sábado · 7:30 p. m.

                </p>

            </div>

        </section>

    </main>

</body>
</html>
